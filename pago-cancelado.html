<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago cancelado — BloomHair</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .cancel-page { padding: 160px 24px 80px; background: #FBF7EE; min-height: 70vh; text-align: center; }
    .cancel-wrap { max-width: 560px; margin: 0 auto; }
    .cancel-icon { width: 84px; height: 84px; margin: 0 auto 32px; border-radius: 50%; background: #eadfcf; color: #8B5A3C; display: flex; align-items: center; justify-content: center; }
    .cancel-title { font-family: 'Cormorant Garamond', serif; font-size: 44px; color: #1B1210; margin-bottom: 16px; line-height: 1.1; }
    .cancel-sub { color: #6a5a4a; font-size: 15px; margin-bottom: 36px; line-height: 1.6; }
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="header" id="site-header"></header>

  <main class="cancel-page">
    <div class="cancel-wrap">
      <div class="cancel-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <p class="eyebrow" style="color:#8B5A3C">PAGO CANCELADO</p>
      <h1 class="cancel-title">Ningún cargo realizado</h1>
      <p class="cancel-sub">Has cancelado el proceso de pago. Tu carrito sigue intacto — puedes volver cuando quieras y completar la compra.</p>
      <div class="btn-group">
        <a href="carrito.html" class="btn btn-primary">VOLVER AL CARRITO</a>
        <a href="shop.html" class="btn btn-outline">SEGUIR COMPRANDO</a>
      </div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
